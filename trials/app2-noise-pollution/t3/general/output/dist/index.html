<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manhattan Noisescape</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0b0e14;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: #e6e6e6;
      }
      #map {
        position: absolute;
        inset: 0;
      }
      #panel {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 10;
        background: rgba(15, 19, 28, 0.85);
        backdrop-filter: blur(6px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        padding: 14px 16px;
        max-width: 320px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.4);
      }
      #panel h1 {
        font-size: 16px;
        margin: 0 0 4px;
        font-weight: 650;
      }
      #panel p {
        font-size: 12px;
        line-height: 1.4;
        margin: 4px 0;
        color: #aab2c0;
      }
      #status {
        font-size: 12px;
        color: #7fd1ff;
        margin-top: 8px;
        min-height: 16px;
      }
      #legend {
        margin-top: 10px;
      }
      #legend .bar {
        height: 12px;
        border-radius: 4px;
        background: linear-gradient(
          to right,
          rgb(255, 255, 204),
          rgb(254, 178, 76),
          rgb(240, 59, 32),
          rgb(128, 0, 38)
        );
      }
      #legend .labels {
        display: flex;
        justify-content: space-between;
        font-size: 11px;
        color: #aab2c0;
        margin-top: 2px;
      }
      #tooltip {
        position: absolute;
        z-index: 20;
        pointer-events: none;
        background: rgba(15, 19, 28, 0.95);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 12px;
        max-width: 260px;
        display: none;
        color: #e6e6e6;
      }
      .selrow {
        margin-top: 8px;
        font-size: 12px;
        color: #ffd479;
        min-height: 16px;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-CvBJZC1m.js"></script>
  </head>
  <body>
    <div id="map"></div>
    <div id="panel">
      <h1>Manhattan Noisescape</h1>
      <p>3D buildings colored by the number of 311 noise complaints within 500&nbsp;m. Click any element (building, road, park, water, surface) to highlight it.</p>
      <div id="legend">
        <div class="bar"></div>
        <div class="labels"><span id="legend-min">0</span><span>noise complaints &le;500&nbsp;m</span><span id="legend-max">max</span></div>
      </div>
      <div id="status">Booting…</div>
      <div class="selrow" id="selrow"></div>
    </div>
    <div id="tooltip"></div>
  </body>
</html>
